<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1265" viewBox="0 0 760 1265" role="img" aria-labelledby="title desc"><title id="title">麦麦复刻结果卡</title><desc id="desc">纯模拟 · 虚构数据；已核价，仍需确认；未创建订单。</desc><rect width="760" height="1265" fill="#f5f7fa"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="58" font-size="25" fill="#20242a" text-anchor="start" font-weight="700">麦麦复刻</text><text x="32" y="85" font-size="14" fill="#20242a" text-anchor="start" font-weight="400">把喜欢的一顿，在这里再吃一次</text><rect x="548" y="34" width="180" height="38" rx="19" fill="#e8edf1"/><text x="638" y="59" font-size="15" fill="#4e5968" text-anchor="middle" font-weight="400">纯模拟</text><rect x="32" y="116" width="696" height="160" rx="24" fill="#ffedac"/><text x="56" y="151" font-size="15" fill="#655a37" text-anchor="start" font-weight="400">复刻结果</text><text x="56" y="207" font-size="38" fill="#20242a" text-anchor="start" font-weight="700">需要替换，仍需确认</text><text x="56" y="248" font-size="18" fill="#20242a" text-anchor="start" font-weight="400">所选规格还需核实，暂未下单。</text><text x="32" y="320" font-size="21" fill="#20242a" text-anchor="start" font-weight="700">餐单与变化</text><text x="32" y="351" font-size="16" fill="#66707d" text-anchor="start" font-weight="400">测试明确条件</text><text x="32" y="389" font-size="17" fill="#20242a" text-anchor="start" font-weight="700">必须保留</text><text x="32" y="416" font-size="16" fill="#66707d" text-anchor="start" font-weight="400">主食 × 1</text><text x="32" y="442" font-size="16" fill="#66707d" text-anchor="start" font-weight="400">饮料 × 1 · 糖：无糖</text><text x="32" y="468" font-size="17" fill="#20242a" text-anchor="start" font-weight="700">偏好与允许变化</text><text x="32" y="495" font-size="16" fill="#66707d" text-anchor="start" font-weight="400">主食：测试主食A；不替换</text><text x="32" y="521" font-size="16" fill="#66707d" text-anchor="start" font-weight="400">饮料：测试无糖中杯 → 测试无糖大杯；仅换同款杯型</text><rect x="32" y="559" width="696" height="114" rx="18" fil