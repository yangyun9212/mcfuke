<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1097" viewBox="0 0 760 1097" role="img" aria-labelledby="title desc"><title id="title">麦麦复刻结果卡</title><desc id="desc">历史记录回放 · 报价需重查；需要你决定下一步；未创建订单。</desc><rect width="760" height="1097" fill="#f5f7fa"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="58" font-size="25" fill="#20242a" text-anchor="start" font-weight="700">麦麦复刻</text><text x="32" y="85" font-size="14" fill="#20242a" text-anchor="start" font-weight="400">把喜欢的一顿，在这里再吃一次</text><rect x="548" y="34" width="180" height="38" rx="19" fill="#e8edf1"/><text x="638" y="59" font-size="15" fill="#4e5968" text-anchor="middle" font-weight="400">历史记录回放</text><rect x="32" y="116" width="696" height="160" rx="24" fill="#ffedac"/><text x="56" y="151" font-size="15" fill="#655a37" text-anchor="start" font-weight="400">复刻结果</text><text x="56" y="207" font-size="38" fill="#20242a" text-anchor="start" font-weight="700">当前候选都超预算</text><text x="56" y="248" font-size="18" fill="#20242a" text-anchor="start" font-weight="400">已检查你接受的餐单，暂未找到预算内方案。</text><text x="32" y="320" font-size="21" fill="#20242a" text-anchor="start" font-weight="700">餐单与变化</text><text x="32" y="351" font-size="16" fill="#66707d" text-anchor="start" font-weight="400">板烧或龙焰鸡腿堡与无糖可乐中杯</text><rect x="32" y="389" width="696" height="114" rx="18" fill="#ffffff" stroke="#c9a451"/><text x="54" y="419" font-size="14" fill="#8b6826" text-anchor="start" font-weight="400">首选餐单 · 最低报价</text><text x="704" y="455" font-size="29" fill="#20242a" text-anchor="end" font-weight="700">¥33.50</text><text x="54" y="449" font-size="19" fill="#20242a" text-anchor="start" font-weight="700">板烧鸡腿堡 × 1</text><text x="54" y="477" font-size="19" fill="#20242a" text-anchor="start" font-weight="400">无糖可口可乐中杯 × 1</text><rect x="32" y="515" width="696" height="139" rx="18" fill="#ffffff" stroke="#e0e5eb"/><text x="54" y="545" font-size="14" fill="#66707d" text-anchor="start" font-weight="400">已接受替代</text><text x="704" y="581" font-size="29" fill="#20242a" text-anchor="end" font-weight="700">¥34.00</text><text x="54" y="575" font-size="19" fill="#20242a" text-anchor="start" font-weight="700">龙焰鸡腿堡 × 1</text><text x="54" y="603" font-size="19" fill="#20242a" text-anchor="start" font-weight="400">无糖可口可乐中杯 × 1</text><text x="54" y="631" font-size="15" fill="#66707d" text-anchor="start" font-weight="400">板烧鸡腿堡 → 龙焰鸡腿堡</text><text x="32" y="678" font-size="17" fill="#8b6826" text-anchor="start" font-weight="700">所选规格还需确认</text><text x="32" y="705" font-size="16" fill="#66707d" text-anchor="start" font-weight="400">规格已提交，但核价结果未显示具体选配。</text><rect x="32" y="743" width="696" height="112" rx="18" fill="#ffffff" stroke="#e0e5eb"/><text x="54" y="773" font-size="17" fill="#20242a" text-anchor="start" font-weight="700">价格与预算</text><text x="54" y="802" font-size="18" fill="#66707d" text-anchor="start" font-weight="400">你的预算 ¥33.00   /   最低已核价 ¥33.50</text><text x="54" y="830" font-size="17" fill="#66707d" text-anchor="start" font-weight="400">超出预算 ¥0.50，本轮未找到达标方案。</text><rect x="32" y="879" width="696" height="118" rx="20" fill="#202b36"/><text x="54" y="915" font-size="21" fill="#ffffff" text-anchor="start" font-weight="700">下一步，先重新查价</text><text x="54" y="951" font-size="18" fill="#d9e1e9" text-anchor="start" font-weight="400">告诉 Agent：重新查一下这份餐单。</text><text x="54" y="977" font-size="14" fill="#aebac6" text-anchor="start" font-weight="400">任何改动都由你决定，确认后再重新核价。</text><text x="32" y="1033" font-size="14" fill="#66707d" text-anchor="start" font-weight="400">2026.10.16 10:39 +0800  ·  已核价 2/2 份候选</text><text x="32" y="1057" font-size="14" fill="#66707d" text-anchor="start" font-weight="400">报价需重查 · 未创建订单</text></g></svg>
